<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>国内保函验真</title>
    <style>
        :root {
            --primary-gradient-start: #5b7fe5;
            --primary-gradient-end: #7c5fcd;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #eeeeee;
            --tip-bg: #fff8f0;
            --tip-text: #8c6d3f;
            --btn-border: #7c6fb0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, var(--primary-gradient-start) 0%, var(--primary-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--primary-gradient-start) 0%, var(--primary-gradient-end) 30%, #f8f8f8 30%);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 16px;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 44px;
        }

        .header-left {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-left::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            border-left: 2px solid #333333;
            border-bottom: 2px solid #333333;
            transform: rotate(45deg);
        }

        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #333333;
            letter-spacing: 0.5px;
        }

        .main-content {
            padding: 16px;
        }

        .info-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 8px rgba(0,0,0,0.06);
        }

        .field-row {
            display: flex;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            min-height: 44px;
            align-items: center;
        }

        .field-row:last-child {
            border-bottom: none;
        }

        .field-label {
            font-size: 14px;
            color: #333333;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 400;
        }

        .field-value {
            font-size: 14px;
            color: #333333;
            text-align: right;
            word-break: break-all;
            line-height: 1.4;
            margin-left: 12px;
            font-weight: 400;
        }

        .tip-section {
            margin-top: 16px;
            background: var(--tip-bg);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .tip-icon {
            font-size: 16px;
            flex-shrink: 0;
            line-height: 1.5;
        }

        .tip-content {
            flex: 1;
        }

        .tip-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--tip-text);
            margin-bottom: 3px;
        }

        .tip-text {
            font-size: 12px;
            color: var(--tip-text);
            line-height: 1.5;
        }

        .back-btn-wrapper {
            margin-top: 24px;
            padding: 0 16px;
        }

        .back-btn {
            width: 100%;
            height: 44px;
            border: 1px solid var(--btn-border);
            border-radius: 22px;
            background: #ffffff;
            color: var(--btn-border);
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 2px;
        }

        .back-btn:hover {
            background: rgba(124, 111, 176, 0.05);
        }

        .back-btn:active {
            transform: scale(0.98);
            background: rgba(124, 111, 176, 0.08);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="https://www.cmbchina.com/corporate/domestic/" class="header-left" target="_blank"></a>
            <div class="header-title">国内保函验真</div>
        </div>

        <div class="main-content">
            <div class="info-card">
                <div class="field-row">
                    <span class="field-label">保函编号：</span>
                    <span class="field-value">110DB26052200035</span>
                </div>
                <div class="field-row">
                    <span class="field-label">保函金额：</span>
                    <span class="field-value">237,000.00</span>
                </div>
                <div class="field-row">
                    <span class="field-label">保函类型：</span>
                    <span class="field-value">质量保函</span>
                </div>
                <div class="field-row">
                    <span class="field-label">被担保人名称：</span>
                    <span class="field-value">天道云（北京）科技有限公司</span>
                </div>
                <div class="field-row">
                    <span class="field-label">受益人名称：</span>
                    <span class="field-value">中国安能集团第三工程局有限公司</span>
                </div>
                <div class="field-row">
                    <span class="field-label">担保银行：</span>
                    <span class="field-value">招商银行股份有限公司北京分行</span>
                </div>
                <div class="field-row">
                    <span class="field-label">保函开立日期：</span>
                    <span class="field-value">2026-05-21</span>
                </div>
                <div class="field-row">
                    <span class="field-label">保函到期日期：</span>
                    <span class="field-value">2031-06-21</span>
                </div>
                <div class="field-row">
                    <span class="field-label">验真结果：</span>
                    <span class="field-value">保函文本已生效</span>
                </div>
            </div>

            <div class="tip-section">
                <span class="tip-icon">🔔</span>
                <div class="tip-content">
                    <div class="tip-title">小招提醒：</div>
                    <div class="tip-text">请注意核对您所持的保函文本中关键字段是否与验真结果完全一致</div>
                </div>
            </div>

            <div class="back-btn-wrapper">
                <button class="back-btn" onclick="window.location.href='https://www.cmbchina.com/corporate/domestic/'">返回</button>
            </div>
        </div>
    </div>
</body>
</html>
